[project]
name = "pixeltable-new"
dynamic = ["version"]
description = "Create a new Pixeltable project in one command"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Pixeltable, Inc.", email = "contact@pixeltable.com" },
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.16.0",
    "rich>=13.7.1",
    "rich-toolkit>=0.15.1",
]

[project.scripts]
pixeltable-new = "pixeltable_new.cli:main"

[project.urls]
Homepage = "https://github.com/pixeltable/pixeltable-new"
Documentation = "https://docs.pixeltable.com/"
Repository = "https://github.com/pixeltable/pixeltable-new"
Issues = "https://github.com/pixeltable/pixeltable-new/issues"
Changelog = "https://github.com/pixeltable/pixeltable-new/blob/main/release-notes.md"
"Starter Kit" = "https://github.com/pixeltable/pixeltable-starter-kit"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
version = { source = "file", path = "src/pixeltable_new/__init__.py" }
distribution = true

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "coverage[toml]>=7.6.1",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
]
xfail_strict = true
junit_family = "xunit2"

[tool.coverage.run]
parallel = true
data_file = "coverage/.coverage"
source = [
    "src/pixeltable_new",
    "tests",
]
dynamic_context = "test_function"
relative_files = true

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true

[tool.mypy]
strict = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true
